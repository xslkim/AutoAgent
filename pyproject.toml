[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autovisiontest"
version = "0.1.0"
description = "AI vision-driven desktop UI automated testing"
readme = "Readme.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "pydantic>=2.5",
    "pygetwindow>=0.0.9",
    "pyautogui>=0.9.54",
    "pyperclip>=1.9",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "mss>=9.0",
    # PaddleOCR 3.x uses PaddleX and breaks our kwargs (`use_gpu`, etc.) on upgrade.
    "paddlepaddle>=2.6,<3",
    "paddleocr>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
http = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
mcp = ["mcp>=1.0"]
cloud = ["openai>=1.40", "anthropic>=0.34"]

[project.scripts]
autovisiontest = "autovisiontest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
