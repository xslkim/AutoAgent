name: Godot adapter PR

on:
  pull_request:
    branches: [main]
    paths:
      - "adapters/godot/**"
      - "fixtures/godot-test-project/**"
      - ".github/workflows/godot-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint + fixture validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      - name: Static fixture validation (Godot slice)
        run: python scripts/fixtures/validate_static_fixtures.py --engine godot

  test:
    name: Godot headless input test
    runs-on: [self-hosted, Windows]
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Link adapter into fixture project
        shell: powershell
        run: |
          # The adapter is a junction locally; a fresh checkout needs it created.
          $link = Join-Path $PWD "fixtures\godot-test-project\addons\autoagent"
          $target = Join-Path $PWD "adapters\godot\addons\autoagent"
          New-Item -ItemType Directory -Force -Path (Split-Path $link) | Out-Null
          if (Test-Path $link) { Remove-Item $link -Recurse -Force }
          New-Item -ItemType Junction -Path $link -Target $target | Out-Null
          Write-Host "Linked $link -> $target"

      - name: Run Godot headless input test
        shell: powershell
        run: |
          $godot = "D:\test\godot\bin\godot.windows.editor.dev.x86_64.mono.exe"
          if (-not (Test-Path $godot)) { throw "Godot not found at $godot" }

          $project = Join-Path $PWD "fixtures\godot-test-project"
          $scene = "res://addons/autoagent/tests/headless_input_test.tscn"

          Write-Host "Importing Godot project: $project"
          $import = Start-Process -FilePath $godot `
            -ArgumentList @('--headless', '--path', $project, '--import') `
            -Wait -PassThru -NoNewWindow
          Write-Host "Import exited with code $($import.ExitCode)"

          Write-Host "Running headless input test: $scene"
          $proc = Start-Process -FilePath $godot `
            -ArgumentList @('--headless', '--path', $project, $scene) `
            -Wait -PassThru -NoNewWindow
          $code = $proc.ExitCode
          Write-Host "Godot exited with code $code"
          exit $code
