name: Godot adapter PR

on:
  pull_request:
    branches: [main]
    paths:
      - "adapters/godot/**"
      - "fixtures/godot-test-project/**"
      - ".github/workflows/godot-pr.yml"

permissions:
  contents: read

# Phase 0 scope: fixture static check only. Real Godot headless test (GUT)
# lands with TASK-0009 (Godot adapter PoC).
jobs:
  lint:
    name: Lint + fixture validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      - name: Static fixture validation (Godot slice)
        run: python scripts/fixtures/validate_static_fixtures.py --engine godot

