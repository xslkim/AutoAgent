name: MCP server PR

on:
  pull_request:
    branches: [main]
    paths:
      - "mcp-server/**"
      - "protocol/**"
      - ".github/workflows/mcp-pr.yml"

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (mcp-server + protocol)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install mcp-server (editable)
        run: |
          python -m pip install -U pip
          pip install -e "./mcp-server[dev]"
          pip install pyyaml jsonschema referencing

      - name: Run mcp-server tests
        run: pytest mcp-server/tests/ -v

      - name: Run protocol schema tests
        run: pytest protocol/tests/ -v

      - name: Verify CLI entry
        run: |
          autoagent-mcp --help
          autoagent-mcp --list-tools | wc -l | grep -q '^17$'
