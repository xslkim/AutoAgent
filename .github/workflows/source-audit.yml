name: Source audit (防护 0.1 + 0.2)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: Path whitelist + visual-write audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install pyyaml jsonschema referencing

      - name: Determine diff range
        id: range
        run: |
          if [ -n "$GITHUB_BASE_REF" ]; then
            git fetch origin "$GITHUB_BASE_REF" --depth=1
            echo "BASE=origin/$GITHUB_BASE_REF" >> "$GITHUB_OUTPUT"
          else
            echo "BASE=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Step 1 — Path whitelist (防护 0.1)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Write PR body to a temp file so check_changed_paths can parse
          # path_exception YAML blocks declared in the PR description.
          PR_BODY_FILE="$(mktemp)"
          printf '%s' "$PR_BODY" > "$PR_BODY_FILE"
          git diff --name-only ${{ steps.range.outputs.BASE }}...HEAD \
            | python scripts/ci/check_changed_paths.py \
                --pr-body-file "$PR_BODY_FILE"

      - name: Step 2 — Visual-write audit (防护 0.2)
        run: |
          python scripts/ci/audit_visual_writes.py \
            --diff ${{ steps.range.outputs.BASE }}...HEAD
