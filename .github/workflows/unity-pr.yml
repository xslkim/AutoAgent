name: Unity adapter PR

on:
  pull_request:
    branches: [main]
    paths:
      - "adapters/unity/**"
      - "fixtures/unity-test-project/**"
      - ".github/workflows/unity-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint + fixture validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      - name: Static fixture validation (Unity slice)
        run: python scripts/fixtures/validate_static_fixtures.py --engine unity

  test:
    name: Unity Test Runner (PlayMode)
    runs-on: [self-hosted, Windows]
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Unity PlayMode tests
        shell: pwsh
        run: |
          $unity = "C:\Program Files\Unity 2023.2.20f1\Editor\Unity.exe"
          if (-not (Test-Path $unity)) { throw "Unity not found at $unity" }

          $project = Join-Path $PWD "fixtures\unity-test-project"
          $results = Join-Path $PWD "unity-test-results.xml"

          Write-Host "Running Unity PlayMode tests on: $project"
          & $unity -runTests -batchmode -accept-apiupdate `
            -projectPath $project `
            -testPlatform PlayMode `
            -testResults $results `
            -logFile -
          $code = $LASTEXITCODE
          Write-Host "Unity exited with code $code"

          if (Test-Path $results) {
            Write-Host "--- test results ($results) ---"
            Get-Content $results
          } else {
            Write-Host "WARNING: no test-results file was produced"
          }
          exit $code

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results
          path: unity-test-results.xml
          if-no-files-found: warn
