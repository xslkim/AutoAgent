name: Unity adapter PR

on:
  pull_request:
    branches: [main]
    paths:
      - "adapters/unity/**"
      - "fixtures/unity-test-project/**"
      - ".github/workflows/unity-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Run Node.js-based actions on Node 24 (Node 20 is deprecated).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint + fixture validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      - name: Static fixture validation (Unity slice)
        run: python scripts/fixtures/validate_static_fixtures.py --engine unity

  test:
    name: Unity Test Runner (EditMode + PlayMode)
    runs-on: [self-hosted, Windows]
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Unity EditMode + PlayMode tests
        shell: powershell
        run: |
          $unity = "C:\Program Files\Unity 2023.2.20f1\Editor\Unity.exe"
          if (-not (Test-Path $unity)) { throw "Unity not found at $unity" }

          $project = Join-Path $PWD "fixtures\unity-test-project"

          # Unity -runTests handles one platform per invocation, so run both.
          # EditMode covers the AutoAgent.Editor.Tests assembly (custom
          # Inspectors etc.); PlayMode covers the runtime adapter tests.
          #
          # Each platform's exit code goes into its own script-scope variable.
          # NB: do NOT wrap this in a function that `return`s the code — any
          # Get-Content output would leak into the function's pipeline and the
          # caller would capture an array instead of the int.
          function Invoke-UnityTests($platform) {
            $results = Join-Path $PWD "unity-test-results-$platform.xml"
            $log = Join-Path $PWD "unity-$platform.log"
            $arguments = @(
              '-runTests', '-batchmode', '-accept-apiupdate',
              '-projectPath', $project,
              '-testPlatform', $platform,
              '-testResults', $results,
              '-logFile', $log
            )
            Write-Host "=== Running Unity $platform tests ==="
            # Unity.exe is a GUI app — Start-Process -Wait is required to block
            # until it finishes and to capture a real exit code.
            $proc = Start-Process -FilePath $unity -ArgumentList $arguments -Wait -PassThru -NoNewWindow
            Write-Host "Unity $platform exited with code $($proc.ExitCode)"
            if (Test-Path $log) {
              Write-Host "----- unity-$platform.log -----"
              Get-Content $log | Out-Host
            }
            if (Test-Path $results) {
              Write-Host "----- $platform test results -----"
              Get-Content $results | Out-Host
            } else {
              Write-Host "WARNING: no $platform test-results file was produced"
            }
            # Surface the exit code via a script-scope variable, never the
            # pipeline — keeps Get-Content output from polluting the result.
            Set-Variable -Name "${platform}ExitCode" -Value $proc.ExitCode -Scope Script
          }

          Invoke-UnityTests "EditMode"
          Invoke-UnityTests "PlayMode"
          if ($script:EditModeExitCode -ne 0) { throw "EditMode tests failed (exit $($script:EditModeExitCode))" }
          if ($script:PlayModeExitCode -ne 0) { throw "PlayMode tests failed (exit $($script:PlayModeExitCode))" }
          Write-Host "All Unity EditMode + PlayMode tests passed."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results
          path: |
            unity-test-results-*.xml
            unity-*.log
          if-no-files-found: warn
