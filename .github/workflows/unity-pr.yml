name: Unity adapter PR

on:
  pull_request:
    branches: [main]
    paths:
      - "adapters/unity/**"
      - "fixtures/unity-test-project/**"
      - ".github/workflows/unity-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Run Node.js-based actions on Node 24 (Node 20 is deprecated).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint + fixture validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      - name: Static fixture validation (Unity slice)
        run: python scripts/fixtures/validate_static_fixtures.py --engine unity

  test:
    name: Unity Test Runner (PlayMode)
    runs-on: [self-hosted, Windows]
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Unity PlayMode tests
        shell: powershell
        run: |
          $unity = "C:\Program Files\Unity 2023.2.20f1\Editor\Unity.exe"
          if (-not (Test-Path $unity)) { throw "Unity not found at $unity" }

          $project = Join-Path $PWD "fixtures\unity-test-project"
          $results = Join-Path $PWD "unity-test-results.xml"
          $log = Join-Path $PWD "unity.log"

          $arguments = @(
            '-runTests', '-batchmode', '-accept-apiupdate',
            '-projectPath', $project,
            '-testPlatform', 'PlayMode',
            '-testResults', $results,
            '-logFile', $log
          )

          Write-Host "Running Unity PlayMode tests on: $project"
          # Unity.exe is a GUI app — Start-Process -Wait is required to block
          # until it finishes and to capture a real exit code.
          $proc = Start-Process -FilePath $unity -ArgumentList $arguments -Wait -PassThru -NoNewWindow
          $code = $proc.ExitCode
          Write-Host "Unity exited with code $code"

          if (Test-Path $log) {
            Write-Host "----- unity.log -----"
            Get-Content $log
          }
          if (Test-Path $results) {
            Write-Host "----- test results -----"
            Get-Content $results
          } else {
            Write-Host "WARNING: no test-results file was produced"
          }
          exit $code

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results
          path: |
            unity-test-results.xml
            unity.log
          if-no-files-found: warn
