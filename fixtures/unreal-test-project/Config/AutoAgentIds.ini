; AutoAgent stable ID registry for the fixture project.
;
; The actual binding lives on UPROPERTY meta tags (AutoAgentId / AutoAgentLogicalRole)
; in Source/AutoAgentTest/*.h. This file is a human-readable mirror used by
; tooling and documentation.

[LoginWidget]
+Id=(C="LoginPanel",Pin="login_panel",Role="image_only")
+Id=(C="AccountInputBg",Pin="account_input_bg",Role="input")
+Id=(C="AccountInputText",Pin="account_input_text",Role="text_display")
+Id=(C="PasswordInputBg",Pin="password_input_bg",Role="input")
+Id=(C="PasswordInputText",Pin="password_input_text",Role="text_display")
+Id=(C="LoginButtonBg",Pin="login_button_bg",Role="button")
+Id=(C="LoginButtonLabel",Pin="login_button_label",Role="text_display")
+Id=(C="ErrorLabel",Pin="error_label",Role="text_display")
+Id=(C="WelcomePanel",Pin="welcome_panel",Role="image_only")
+Id=(C="WelcomeText",Pin="welcome_text",Role="text_display")

[PocPlaygroundWidget]
+Id=(C="ClickTarget",Pin="click_target",Role="button")
+Id=(C="ClickTargetVariant1",Pin="click_target_variant_1",Role="button")
+Id=(C="ClickTargetVariant2",Pin="click_target_variant_2",Role="button")
+Id=(C="ClickTargetVariant3",Pin="click_target_variant_3",Role="button")
+Id=(C="ClickTargetVariant4",Pin="click_target_variant_4",Role="button")
+Id=(C="ClickTargetVariant5",Pin="click_target_variant_5",Role="button")
+Id=(C="TextTarget",Pin="text_target",Role="input")
+Id=(C="TextTargetText",Pin="text_target_text",Role="text_display")
+Id=(C="DragSource",Pin="drag_source",Role="drag_source")
+Id=(C="DragTarget",Pin="drag_target",Role="drop_target")
+Id=(C="ScrollContainer",Pin="scroll_container",Role="scroll_container")
+Id=(C="ScrollContent",Pin="scroll_content",Role="image_only")

[ButtonStateSprites]
+Sprite=(Owner="LoginButtonBg",State="normal",Path="/Game/UI/Sprites/btn_login_normal")
+Sprite=(Owner="LoginButtonBg",State="hover",Path="/Game/UI/Sprites/btn_login_hover")
+Sprite=(Owner="LoginButtonBg",State="pressed",Path="/Game/UI/Sprites/btn_login_pressed")
+Sprite=(Owner="LoginButtonBg",State="disabled",Path="/Game/UI/Sprites/btn_login_disabled")

[InputStateSprites]
+Sprite=(Owner="AccountInputBg",State="normal",Path="/Game/UI/Sprites/input_bg_normal")
+Sprite=(Owner="AccountInputBg",State="focused",Path="/Game/UI/Sprites/input_bg_focused")
+Sprite=(Owner="PasswordInputBg",State="normal",Path="/Game/UI/Sprites/input_bg_normal")
+Sprite=(Owner="PasswordInputBg",State="focused",Path="/Game/UI/Sprites/input_bg_focused")
