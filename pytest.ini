[pytest]
# importlib mode lets the per-component `tests/` packages (protocol, mcp-server,
# scripts/ci, scripts/orchestrator, scripts/agent) be collected together without
# top-level package-name collisions.
addopts = --import-mode=importlib
asyncio_mode = auto
# mcp-server is a src-layout package; expose autoagent_mcp for its tests.
pythonpath = mcp-server/src
testpaths =
    protocol/tests
    mcp-server/tests
    scripts/ci/tests
    scripts/orchestrator/tests
    scripts/agent/tests
