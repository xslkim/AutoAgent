# Path whitelist — 防护 0.1
#
# Authoritative source for "what paths the AI may modify".
# Human-readable summary lives at docs/07-agent-operations.md §3.2; on conflict THIS FILE wins.
#
# Three categories, evaluated in this order per path:
#   1. exception (passed via --exception, from task path_exception field) → allow
#   2. deny       → violation (exit 1)
#   3. review_required → allow but PR auto-labels needs-human-review
#   4. allow      → allow
#   Default (no rule matches) → violation (exit 1, "no whitelist rule")
#
# Glob syntax (gitignore-like):
#   *      any chars except /
#   **     any chars including / (zero or more path segments)
#   ?      single char except /
#   [...]  char class (e.g. [0-9])
#
# All patterns are full-path anchored.

allow:
  # Engine adapters — AI implements interactive controls here
  - "adapters/unity/Runtime/**/*.cs"
  - "adapters/unity/Editor/**/*.cs"
  - "adapters/unity/Tests/**/*.cs"
  - "adapters/unity/package.json"
  - "adapters/unity/**/*.asmdef"
  # Unity .meta sidecars — must travel with the asset they describe; a new
  # .cs / .asmdef is incomplete without its .meta (stable GUID for refs).
  - "adapters/unity/**/*.meta"
  # Unity .xml in the adapter — IL2CPP link.xml (anti-strip config).
  - "adapters/unity/**/*.xml"
  - "adapters/unreal/Source/**/*.h"
  - "adapters/unreal/Source/**/*.cpp"
  - "adapters/unreal/Source/**/*.cs"
  - "adapters/unreal/Tests/**"
  - "adapters/unreal/*.uplugin"
  - "adapters/godot/addons/autoagent/**/*.gd"
  - "adapters/godot/addons/autoagent/**/*.cfg"

  # MCP server
  - "mcp-server/src/**/*.py"
  - "mcp-server/tests/**/*.py"
  - "mcp-server/pyproject.toml"
  - "mcp-server/README.md"

  # Protocol schema
  - "protocol/schema/**/*.json"
  - "protocol/tests/**/*.py"
  - "protocol/README.md"

  # CI / e2e / orchestrator / agent scripts
  - "scripts/ci/**"
  - "scripts/e2e/**"
  - "scripts/orchestrator/**"
  - "scripts/agent/**"
  - "scripts/fixtures/**/*.py"

  # Fixture user scripts (AI implements interactivity)
  - "fixtures/*/Scripts/**/*.cs"
  - "fixtures/*/Scripts/**/*.cpp"
  - "fixtures/*/Scripts/**/*.h"
  - "fixtures/*/Scripts/**/*.gd"
  - "fixtures/unreal-test-project/Source/**/*.h"
  - "fixtures/unreal-test-project/Source/**/*.cpp"

  # Task status (AI updates status field only; new tasks / reordering require human)
  - "docs/tasks.md"

review_required:
  # CI workflow — auto-add needs-human-review label
  - ".github/workflows/**"

  # Task DSL / runner config / orchestrator prompt / user guides
  - "docs/canonical-tasks/**/*.yaml"
  - "docs/runners-inventory.md"
  - "docs/orchestrator-prompt.md"
  - "docs/user-guide-*.md"
  - "docs/users/**/*.md"
  - "docs/phase*-gate-report.md"
  - "docs/*-report.md"

  # Engine package manifests (fixture-level deps)
  - "fixtures/*/Packages/manifest.json"
  - "fixtures/unreal-test-project/Config/AutoAgentIds.ini"

  # Repo root common files
  - ".gitignore"
  - "LICENSE"
  - "README.md"

  # UE plugin resources (may carry art — human eyeballs)
  - "adapters/unreal/Resources/**"

deny:
  # Engine scene / WBP / map binary files
  - "fixtures/*/**.unity"
  - "fixtures/*/**.uasset"
  - "fixtures/*/**.tscn"
  - "fixtures/*/**.umap"

  # Art assets
  - "fixtures/*/Assets/Sprites/**"
  - "fixtures/*/Resources/UI/**"
  - "fixtures/*/Content/UI/**"

  # Fonts
  - "fixtures/*/Assets/Fonts/**"
  - "fixtures/*/Content/UI/Fonts/**"

  # Engine project settings (fixture-level — AI cannot tamper)
  - "fixtures/*/ProjectSettings/**"
  - "fixtures/*/Config/DefaultEngine.ini"

  # Visual baselines (single-PR by humans only)
  - "baselines/**"

  # Secrets — permanently denied
  - ".env"
  - ".env.*"
  - "*.key"
  - "*.pem"
  - "secrets/**"

  # Product / spec docs (00-19)
  - "docs/0[0-9]-*.md"
  - "docs/1[0-9]-*.md"

  # Git internals
  - ".git/**"
