[project]
name = "autoagent-mcp"
version = "0.1.0"
description = "AutoAgent MCP server — routes Claude Code tool calls to engine adapters via WebSocket."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AutoAgent contributors" }]
dependencies = [
    "mcp>=1.27.0",
    "websockets>=13.0",
    "scikit-image>=0.24.0",
    "pydantic>=2.8.0",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
lpips = [
    "torch>=2.0",
    "lpips>=0.1.4",
    "Pillow>=10.0",
]

[project.scripts]
autoagent-mcp    = "autoagent_mcp.cli:cli"
autoagent-stop   = "autoagent_mcp.agent_cli:main_stop"
autoagent-status = "autoagent_mcp.agent_cli:main_status"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoagent_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
